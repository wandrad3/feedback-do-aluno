name: Diagnóstico de e-mail

on:
  workflow_dispatch:
    inputs:
      testar_envio:
        description: "Enviar um alerta de teste e um relatório para identidades verificadas"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::315205584370:role/feedback-aluno-github-deploy
          aws-region: us-east-2
      - name: Verificar identidades SES e classes de erro
        env:
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          EMAIL_ADMIN_ADICIONAL: ${{ secrets.EMAIL_ADMIN_ADICIONAL }}
          TESTAR_ENVIO: ${{ inputs.testar_envio }}
        run: python3 scripts/diagnostico_email.py
